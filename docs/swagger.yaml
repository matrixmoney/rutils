basePath: /
definitions:
  api.AgeRequest:
    properties:
      dob:
        description: 'format: YYYY-MM-DD'
        type: string
      today:
        description: 'format: YYYY-MM-DD'
        type: string
    type: object
  api.BMIRequest:
    properties:
      height:
        type: number
      heightUnit:
        description: e.g., "meters", "centimeters", "feet", "inches"
        type: string
      weight:
        type: number
      weightUnit:
        description: e.g., "kilograms", "pounds"
        type: string
    type: object
  api.BMIResponse:
    properties:
      bmi:
        type: number
      category:
        type: string
    type: object
  api.CompoundInterestRequest:
    properties:
      annualInterestRate:
        type: number
      compoundingFrequency:
        description: '"yearly" | "half_yearly" | "quarterly" | "monthly" | "daily"'
        type: string
      principal:
        type: number
      time:
        type: number
      timeUnit:
        description: '"years" | "months"'
        type: string
    type: object
  api.EMIRequest:
    properties:
      annualInterestRate:
        type: number
      principal:
        type: number
      tenure:
        type: number
      tenureUnit:
        description: '"months" or "years"'
        type: string
    type: object
  api.GPARequest:
    properties:
      cgpa:
        description: mode = "cgpa_to_percentage" | "percentage_to_cgpa"
        type: number
      completedCredits:
        type: number
      courses:
        description: mode = "semester_gpa"
        items:
          $ref: '#/definitions/converter.GPACourse'
        type: array
      currentCgpa:
        description: mode = "target_gpa"
        type: number
      grade:
        description: mode = "grade_to_point"
        type: string
      gradingScale:
        type: string
      mode:
        type: string
      multiplier:
        type: number
      percentage:
        type: number
      remainingCredits:
        type: number
      scale:
        type: number
      semesters:
        description: mode = "cumulative_cgpa"
        items:
          $ref: '#/definitions/converter.GPASemester'
        type: array
      targetCgpa:
        type: number
    type: object
  api.LoanTenureRequest:
    properties:
      annualInterestRate:
        type: number
      monthlyPayment:
        type: number
      principal:
        type: number
    type: object
  api.MeasurementRequest:
    properties:
      category:
        type: string
      fromUnit:
        type: string
      toUnit:
        type: string
      value:
        type: number
    type: object
  api.MeasurementResponse:
    properties:
      result:
        type: number
    type: object
  api.NumeralRequest:
    properties:
      fromBase:
        type: string
      toBase:
        type: string
      value:
        type: string
    type: object
  api.NumeralResponse:
    properties:
      result:
        type: string
    type: object
  api.PercentageRequest:
    properties:
      operation:
        type: string
      value1:
        type: number
      value2:
        type: number
      value3:
        type: number
    type: object
  api.ScientificRequest:
    properties:
      angleUnit:
        type: string
      operation:
        type: string
      value1:
        type: number
      value2:
        type: number
    type: object
  api.SimpleInterestRequest:
    properties:
      annualInterestRate:
        type: number
      principal:
        type: number
      time:
        type: number
      timeUnit:
        description: '"years" | "months" | "days"'
        type: string
