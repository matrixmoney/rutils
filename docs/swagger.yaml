        example: StrongP@ssw0rd!
        type: string
      email:
        example: jane@example.com
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: StrongP@ssw0rd!
        type: string
    type: object
  auth.ResetPasswordRequest:
