host: localhost:8080
info:
  contact: {}
  description: Utility Microservice for converting files and user authentication.
  title: File Converter API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the password for the currently authenticated user and sends
        an email confirmation. Requires Bearer JWT.
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Current password incorrect or unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password for logged-in user
      tags:
      - Authentication
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a temporary password to the user's email. When used to log
        in, forces password reset.
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Temporary password dispatched
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Account not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send temporary password via Google SMTP
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns a signed JWT token.
        If logged in with a temporary password, must_reset_password will be true.
      parameters:
      - description: User Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Clears the user's authentication session
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/auth.MessageResponse'
      summary: Logout user
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns the profile details for the authenticated user. Requires
        Bearer JWT.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get logged-in user profile
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user with name, email, password, and confirm_password.
        Requires strong password.
      parameters:
      - description: User Registration Information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a permanent password for a user logged in with a temporary
        password. Requires Bearer JWT.
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reset password
      tags:
      - Authentication
  /calculate-age:
    post:
      consumes:
      - application/json
      description: Calculates exact age, next birthday, and life summary based on
        date of birth and a reference date.
      parameters:
      - description: Age Calculation Request (Dates in YYYY-MM-DD format)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Age Result
          schema:
            $ref: '#/definitions/converter.AgeCalculationResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Age Calculator
  /calculate-bmi:
    post:
      consumes:
      - application/json
      description: Calculates Body Mass Index (BMI) based on weight and height
      parameters:
      - description: BMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: BMI Result
          schema:
            $ref: '#/definitions/api.BMIResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: BMI Calculator
  /calculate-compound-interest:
    post:
      consumes:
      - application/json
      description: |-
        Calculates the compound interest, total amount, effective annual rate,
        and (for tenures вүҘ 1 year) a year-by-year growth schedule.

        **Formula:** `A = P Г— (1 + r/n)^(nГ—t)`   and   `CI = A вҲ’ P`
        where `r` is the annual rate in decimal form, `n` is the number of
        compounding periods per year, and `t` is the tenure in years.

        **Limits:**
        - `principal` must be positive and вүӨ 1 trillion.
        - `annualInterestRate` must be between 0 and 100.
        - `time` must be positive; tenure must be вүӨ 100 years.
        - `timeUnit` must be `"years"` or `"months"` (day-based tenure is rejected).
        - `compoundingFrequency` must be one of `yearly`, `half_yearly`,
        `quarterly`, `monthly`, `daily` (defaults to `yearly`).
      parameters:
      - description: Compound Interest Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CompoundInterestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Compound Interest Result
          schema:
            $ref: '#/definitions/converter.CompoundInterestResponse'
        "400":
          description: Bad Request - invalid input
          schema:
            type: string
      summary: Compound Interest Calculator
      tags:
      - Calculators
  /calculate-emi:
    post:
      consumes:
      - application/json
      description: |-
        Calculates the Equated Monthly Installment (EMI) for a loan along with
        the total interest, total payment, principal/interest split, and a
        month-by-month amortization schedule.

        **Formula:** `EMI = [P × r × (1+r)^N] / [(1+r)^N − 1]`
        where `r` is the monthly interest rate (annual / 12 / 100) and `N` is
        the tenure in months.

        **Special case:** an annual interest rate of `0` returns a simple
        `principal / tenure` division (interest-free loan).

        **Limits:**
        - `principal` must be positive and ≤ 1 trillion.
        - `annualInterestRate` must be between 0 and 100.
        - `tenure` must be positive; tenure in months must be ≤ 600.
        - `tenureUnit` must be exactly `"months"` or `"years"`.
      parameters:
      - description: EMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.EMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: EMI Result
          schema:
            $ref: '#/definitions/converter.EMIResponse'
        "400":
          description: Bad Request - invalid input
          schema:
            type: string
      summary: Loan EMI Calculator
      tags:
      - Calculators
  /calculate-gpa:
    post:
      consumes:
      - application/json
      description: |-
        Performs any GPA or CGPA calculation through a single `mode`-discriminated endpoint.

        **Supported modes (`mode` field):**
        - `semester_gpa`        (courses[])                            — credit-weighted GPA for one semester
        - `cumulative_cgpa`     (semesters[])                          — credit-weighted CGPA across semesters
        - `cgpa_to_percentage`  (cgpa, multiplier?)                    — CGPA → percentage (default 9.5)
        - `percentage_to_cgpa`  (percentage, multiplier?)              — percentage → CGPA
        - `grade_to_point`      (grade, gradingScale?)                 — letter grade → numeric grade point
        - `target_gpa`          (currentCgpa, completedCredits,
        targetCgpa, remainingCredits, scale?)  — required GPA to reach a target CGPA

        **Mode details:**

        **semester_gpa** — send a `courses` array where each item is:
        `{"name": "Math", "credits": 4, "gradePoint": 9}`.
        GPA = Σ(credits × gradePoint) / Σ(credits). The response
        includes a per-course breakdown and the formula steps.

        **cumulative_cgpa** — send a `semesters` array where each item is:
        `{"name": "Sem 1", "credits": 20, "gpa": 8.5}`.
        CGPA = Σ(credits × gpa) / Σ(credits). The response includes
        a per-semester breakdown.

        **cgpa_to_percentage** — converts a CGPA to a percentage using
        the supplied `multiplier`. Defaults to 9.5 (CBSE). Common
        alternatives: 10.0 (VTU/KTU), 7.25 (Mumbai University).
        The output is capped at 100%.

        **percentage_to_cgpa** — inverse of the above.

        **grade_to_point** — looks up the numeric grade point for a
        letter grade. Supported scales: `"10"` (default, CBSE/AICTE),
        `"4"` (US university), `"5"` (European secondary).

        **target_gpa** — solves for the GPA the student must average
        in their remaining credits to reach a desired overall CGPA:
        `requiredGPA = (targetCGPA × totalCredits − currentCGPA × completedCredits) / remainingCredits`.
        The response always carries an `extra.achievable` boolean; if
        the required GPA exceeds the scale, `extra.warning` explains why.

        **Limits (v1):**
        - Grade points, GPAs, and CGPAs must be in [0, 10] for modes
        1–4. Mode 6 accepts a custom `scale` (default 10).
        - Credits must be positive.
        - All numeric inputs must be finite (NaN / Inf rejected).
      parameters:
      - description: GPA / CGPA Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.GPARequest'
      produces:
      - application/json
      responses:
        "200":
          description: GPA Result
          schema:
            $ref: '#/definitions/converter.GPAResponse'
        "400":
          description: Bad Request - invalid mode or parameters
          schema:
            type: string
      summary: GPA / CGPA Calculator
      tags:
      - Calculators
  /calculate-loan-tenure:
    post:
      consumes:
      - application/json
      description: |-
        Computes how long it will take to repay a loan when the borrower fixes a monthly payment.

        **Use case:** a user has a loan amount and knows only how much they can pay per month — this endpoint tells them how many months/years it will take to repay, and how much interest they will pay in total.

        **Formula (loan amortization solved for N):**
        `N = -log(1 - (P × r) / EMI) / log(1 + r)`
        where `r` is the monthly rate (annual / 12 / 100) and `EMI` is the borrower's fixed monthly payment.

        **Rejection rule:** if the monthly payment does not at least cover the monthly interest on the principal (i.e. `EMI ≤ P × r`), the loan would never be repaid, so the endpoint returns a 400 with a helpful suggestion.

        **Limits:**
        - `principal` must be positive and ≤ 1 trillion.
        - `annualInterestRate` must be between 0 and 100.
        - `monthlyPayment` must be positive.
        - Computed tenure must not exceed 600 months (50 years).
      parameters:
      - description: Loan Tenure Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.LoanTenureRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Loan Tenure Result
          schema:
            $ref: '#/definitions/converter.LoanTenureResponse'
        "400":
          description: Bad Request - invalid input or unrepayable loan
          schema:
            type: string
      summary: Loan Tenure Calculator (Borrower-Centric)
      tags:
      - Calculators
  /calculate-percentage:
    post:
      consumes:
      - application/json
      description: |-
        Performs any percentage operation (X% of Y, what %, change, increase, decrease,

        **Supported operations (`operation` field):**
        - `percent_of`              (value1 = percent, value2 = number)
        - `what_percent`            (value1 = part, value2 = whole)
        - `percent_change`          (value1 = old, value2 = new)
        - `percent_increase`        (value1 = number, value2 = percent)
        - `percent_decrease`        (value1 = number, value2 = percent)
        - `reverse_percent`         (value1 = final, value2 = percent)
        - `is_percent_of_what`      (value1 = part, value2 = percent)
        - `percent_difference`      (value1 = a, value2 = b)
        - `add_percent_points`      (value1 = p1%, value2 = p2%)
        - `subtract_percent_points` (value1 = p1%, value2 = p2%)
        - `discount`                (value1 = price, value2 = discount%)
        - `markup`                  (value1 = cost, value2 = markup%)
        - `profit_loss`             (value1 = cost, value2 = selling)
        - `percent_to_fraction`     (value1 = percent)
        - `fraction_to_percent`     (value1 = numerator, value2 = denominator)
        - `decimal_to_percent`      (value1 = decimal)
        - `compound_percent`        (value1 = base, value2 = percent, value3 = periods)
        - `marks_percentage`        (value1 = obtained, value2 = total)
        - `cgpa_to_percent`         (value1 = cgpa; uses CBSE factor 9.5)
      parameters:
      - description: Percentage Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PercentageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Percentage Result
          schema:
            $ref: '#/definitions/converter.PercentageResponse'
        "400":
          description: Bad Request - invalid operation or parameters
          schema:
            type: string
      summary: Percentage Calculator
      tags:
      - Percentage Calculator
  /calculate-scientific:
    post:
      consumes:
      - application/json
      description: |-
        Performs any scientific / mathematical operation through a single `operation`-discriminated endpoint.

        **Operation groups (`operation` field):**
        - Constants:      `pi`, `e`
        - Trigonometric:  `sin`, `cos`, `tan`, `csc`, `sec`, `cot`
        - Inverse trig:   `asin`, `acos`, `atan`, `atan2` (2-arg)
        - Hyperbolic:     `sinh`, `cosh`, `tanh`, `asinh`, `acosh`, `atanh`
        - Log / Exp:      `log`, `ln`, `log_base` (2-arg), `exp`
        - Powers / Roots: `pow` (2-arg), `sqrt`, `cbrt`, `nth_root` (2-arg)
        - Rounding:       `abs`, `floor`, `ceil`, `round`, `trunc`, `sign`
        - Combinatorics:  `factorial`, `ncr` (2-arg), `npr` (2-arg)
        - Misc:           `gcd` (2-arg), `lcm` (2-arg), `mod` (2-arg), `hypot` (2-arg)

        **Angle unit:** Trig and inverse-trig operations accept an optional
        `angleUnit` field (`"degrees"` or `"radians"`, default `"radians"`).
        The same unit governs both the input of `sin/cos/tan/...` and the
        output of `asin/acos/atan/atan2`. Hyperbolic operations are unaffected.

        **Validation:** Domain violations (e.g. `sqrt(-1)`, `ln(0)`, `asin(2)`,
        `tan(90°)`) return a 400 error with a descriptive message.
      parameters:
      - description: Scientific Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ScientificRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Scientific Result
          schema:
            $ref: '#/definitions/converter.ScientificResponse'
        "400":
          description: Bad Request - invalid operation, parameters, or domain error
          schema:
            type: string
      summary: Scientific Calculator
      tags:
      - Scientific Calculator
  /calculate-simple-interest:
    post:
      consumes:
      - application/json
      description: |-
        Calculates the simple interest and total amount for a loan or investment.

        **Formula:** `SI = (P Г— R Г— T) / 100`
        where `P` is the principal, `R` is the annual rate in percent,
        and `T` is the tenure expressed in years.

        **Limits:**
        - `principal` must be positive and вүӨ 1 trillion.
        - `annualInterestRate` must be between 0 and 100.
        - `time` must be positive; tenure must be вүӨ 100 years.
        - `timeUnit` must be `"years"`, `"months"`, or `"days"`.
      parameters:
      - description: Simple Interest Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.SimpleInterestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Simple Interest Result
          schema:
            $ref: '#/definitions/converter.SimpleInterestResponse'
        "400":
          description: Bad Request - invalid input
          schema:
            type: string
      summary: Simple Interest Calculator
      tags:
      - Calculators
  /calculate-tax:
    post:
      consumes:
      - application/json
      description: |-
        Performs any tax calculation through a single `mode`-discriminated endpoint.

        **Supported modes (`mode` field):**
        - `add_tax`      (amount, taxRate)                       — exclusive → inclusive
        - `remove_tax`   (amount, taxRate)                       — inclusive → exclusive
        - `find_rate`    (netAmount, grossAmount)                — effective tax rate
        - `split_gst`    (amount, taxRate, taxType)              — CGST+SGST or IGST breakdown
        - `reverse_gst`  (taxPaid, taxRate)                      — recover net from tax paid
        - `income_tax`   (income, slabs[], regime?)              — progressive slab tax

        **Notes:**
        - The endpoint is country-neutral: the client supplies the rate and, for income tax, the slab schedule.
        - For `split_gst`, `taxType` must be `cgst_sgst` (default) or `igst`.
        - For `income_tax`, slabs must be non-overlapping; at most one slab may have `to = 0` (open-ended).
      parameters:
      - description: Tax Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.TaxRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tax Result
          schema:
            $ref: '#/definitions/converter.TaxResponse'
        "400":
          description: Bad Request - invalid mode or parameters
          schema:
            type: string
      summary: Tax / VAT / GST Calculator
      tags:
      - Calculators
  /compress-image:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload an image and re-encode it toward a requested target size or percentage.

        **Supported inputs:** JPG, PNG, WEBP, TIFF, BMP.

        **Conversion types:**
        - `compress` — quality ladder walks down from 95 until the target is met (or the floor is reached).
        - `expand`   — quality ladder walks up from 80 toward 100. Only `dataType=percentage` is allowed.

        **Data types:**
        - `percentage` — `targetValue` is 1–99 for compress, 101–1000 for expand.
        - `size`       — `targetValue` is a size number in `sizeUnit` (KB or MB). Compress only.

        **Target formats:** `auto` keeps the source (TIFF/BMP fall back to JPG), or force `jpg`, `png`, or `webp`.
        WebP encoding requires the `cwebp` binary on the server's PATH.

        **Limits:** upload ≤ 25 MB, output ≤ 25 MB, size target 1 KB – 20 MB.

        **Response headers:**
        - `X-Compress-Target-Met` : `true` if the target was reached, `false` if the smallest achievable size was returned.
        - `X-Compress-Target-Size`: the requested target in bytes.
        - `X-Compress-Actual-Size`: the actual output size in bytes.
        - `X-Compress-Format`     : the output format: `jpg`, `png`, or `webp`.
        - `X-Compress-Quality`    : the final quality used (1–100), or `0` for PNG.
        - `X-Compress-Dimensions` : the final output pixel dimensions, e.g. `1920x1080`.
      parameters:
      - description: Image file (max 25 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: compress or expand
        in: formData
        name: conversionType
        required: true
        type: string
      - description: percentage or size
        in: formData
        name: dataType
        required: true
        type: string
      - description: Target percentage (1-99 / 101-1000) or size number
        in: formData
        name: targetValue
        required: true
        type: number
      - description: KB or MB (only when dataType=size; default KB)
        in: formData
        name: sizeUnit
        type: string
      - description: auto, jpg, png, or webp (default auto)
        in: formData
        name: targetFormat
        type: string
      - description: Cap on the longest edge in pixels (0 = no resize)
        in: formData
        name: maxDimension
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Compressed image
          schema:
            type: file
        "400":
          description: Bad Request - invalid parameters or unsupported format
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Compress or expand an image
      tags:
      - Image Compressor
  /convert:
    post:
      consumes:
      - multipart/form-data
      description: Converts any supported file type to another supported file type
